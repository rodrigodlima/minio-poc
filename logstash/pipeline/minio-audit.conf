input {
  http {
    port => 5044
  }
}

filter {
  # Parse the JSON message from MinIO
  json {
    source => "message"
    target => "minio"
  }

  # Remove the original message field to avoid duplication
  mutate {
    remove_field => ["message"]
  }

  # Parse timestamp from MinIO event
  if [minio][time] {
    date {
      match => ["[minio][time]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add useful fields at root level for easier querying
  if [minio][api][name] {
    mutate {
      add_field => {
        "api_name" => "%{[minio][api][name]}"
        "api_status" => "%{[minio][api][status]}"
        "bucket" => "%{[minio][api][bucket]}"
      }
    }
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "minio-audit-%{+YYYY.MM.dd}"
  }

  # Debug output - remove in production
  stdout {
    codec => rubydebug
  }
}
