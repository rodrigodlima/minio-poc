input {
  http {
    port => 5044
    codec => json
  }
}

filter {
  mutate {
    add_field => { "[@metadata][index]" => "minio-audit" }
  }

  # Parse timestamp if present
  if [time] {
    date {
      match => [ "time", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "minio-audit-%{+YYYY.MM.dd}"
  }

  # Optional: stdout for debugging
  stdout {
    codec => rubydebug
  }
}
